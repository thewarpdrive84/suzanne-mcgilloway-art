<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script src="/scripts/menu.js" defer></script>

    <title>Suzanne McGilloway Art</title>
  </head>

  <body>
    <!-- Website heading and navigation -->
    <header class="site-header">
      <h1>
        <a href="/index.html">Suzanne McGilloway Art</a>
      </h1>

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="siteMenu"
      >
        <span class="menu-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="menu-label">Menu</span>
      </button>

      <div class="menu-overlay" id="menuOverlay"></div>

      <nav class="side-menu" id="siteMenu" aria-label="Main navigation">
        <button
          class="menu-close"
          id="menuClose"
          type="button"
          aria-label="Close navigation menu"
        >
          &times;
        </button>

        <a href="/index.html">Home</a>
        <a href="/prints.html">Prints</a>
        <a href="/about.html">About</a>
        <a href="/news.html">News</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </header>

    <main class="contact-page">
      <h2>Get in Touch</h2>
      <p>
        For enquiries about Suzanne's artwork, prints or exhibitions, please get
        in touch using the form below.
      </p>

      <form action="https://formspree.io/f/xaenzzqp" method="POST">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required />

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required />

        <label for="message">Your message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </main>
    <footer>
      <div class="footer-links">
        <a
          href="mailto:suzanne.mcgilloway@gmail.com"
          class="email-link"
          aria-label="Email Suzanne McGilloway"
        >
          <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <polyline points="3,7 12,13 21,7"></polyline>
          </svg>
          Email
        </a>

        <a
          href="https://www.instagram.com/livinginclip81/"
          target="_blank"
          rel="noopener noreferrer"
          class="instagram-link"
          aria-label="Suzanne McGilloway on Instagram"
        >
          <svg class="contact-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
          Instagram
        </a>
      </div>
      <p>&copy; All Rights Reserved Suzanne McGilloway Art 2026</p>
    </footer>
  </body>
</html>
